<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1b33">
<title>FNL Rebels Playbook</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#07111f;--panel:#0b1b33;--card:#12233f;--line:#274060;--text:#f6f8fb;--muted:#9fb1c7;--accent:#ef5350;--los:#ffca28}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow:hidden}
button,select,input{font:inherit}
.app{height:100dvh;width:100vw;display:flex;align-items:stretch;justify-content:center;background:var(--bg)}
.field-wrap{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:var(--panel)}
.top-left-stack{position:absolute;left:10px;top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:145px}
.top-left{position:static}
.top-left-stack .pill{max-width:145px;padding:0 12px;font-size:12px;white-space:nowrap}
#personnelBtn{margin-top:14px}
.top-right-stack{position:absolute;right:10px;top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;flex-direction:column;gap:6px;align-items:flex-end;background:transparent}
#playBtn{margin-top:8px}
.save-icon{width:48px;height:48px;min-width:48px;min-height:48px;padding:0;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden}
.save-icon svg{display:block;width:30px;height:30px;transform:none;flex:0 0 auto}
.pill{min-height:42px;border-radius:999px;border:1px solid var(--line);background:rgba(18,35,63,.96);color:var(--text);padding:0 14px;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.heading{position:absolute;top:max(8px,env(safe-area-inset-top));left:84px;right:84px;z-index:19;text-align:center;pointer-events:none}
.name-row{display:flex;justify-content:center;align-items:center;gap:4px;pointer-events:auto}
.play-name{border:0;background:transparent;color:var(--text);font-weight:900;font-size:16px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit{border:0;background:transparent;color:var(--muted);font-size:16px;padding:4px}
.ball-row{pointer-events:auto;margin-top:2px;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.ball-control{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:rgba(18,35,63,.96);border-radius:999px;padding:3px 8px;font-size:9px;font-weight:900;color:var(--muted)}
.ball-control select{border:0;background:transparent;color:var(--text);font-weight:900;font-size:11px}
svg{width:100%;height:100%;display:block;background:linear-gradient(#102b49,#0d2440)}
.route-wrap{position:absolute;right:8px;top:118px;z-index:18;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.route-toggle,.route-pill{border:1px solid var(--line);background:rgba(18,35,63,.96);color:var(--text);font-weight:900;border-radius:999px}
.route-toggle{height:34px;padding:0 11px;font-size:10px}
.route-rail{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.route-rail.hidden{display:none}
.route-pill{height:34px;min-width:72px;padding:0 10px;font-size:9px;white-space:nowrap;touch-action:manipulation}
.bottom-center{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:18}
.selected{min-height:42px;border-radius:999px;border:1px solid var(--line);background:rgba(18,35,63,.96);padding:0 14px;font-weight:900;font-size:11px;color:var(--text)}
.bottom-controls{position:absolute;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:18;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.bottom-keys{position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:17;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.key{font-size:8px;color:var(--muted);background:rgba(18,35,63,.92);border:1px solid var(--line);border-radius:999px;padding:5px 8px;white-space:nowrap}
.key.pass{color:#ff8a80}
dialog{width:min(92vw,480px);border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{padding:16px}.sheet h3{margin:0 0 4px}.sheet p{margin:0 0 16px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{width:100%}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.saved{display:flex;gap:6px;align-items:center}.saved button:first-child{flex:1;text-align:left;min-width:0}.saved .share-btn,.saved .delete-btn{padding:0 10px;min-width:70px}
body.shared-view .top-left-stack,
body.shared-view #diagramSaveBtn,
body.shared-view .route-wrap,
body.shared-view .bottom-controls,
body.shared-view .bottom-center,
body.shared-view .bottom-keys,
body.shared-view #personnelDrawer,
body.shared-view .edit,
body.shared-view .ball-row{display:none!important}
body.shared-view .heading{left:90px;right:90px}
body.shared-view .top-right-stack{top:max(10px,env(safe-area-inset-top))}
body.shared-view #playBtn{display:block}
.pill.busy{opacity:.7;pointer-events:none}
.pill.success{outline:2px solid rgba(255,255,255,.75)}
.name-editor{position:absolute;left:50%;top:68px;transform:translateX(-50%);z-index:30;width:min(82%,340px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:none}
.name-editor.open{display:block}.name-editor .row{display:flex;gap:8px}.name-editor input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);padding:10px}
.small{font-size:12px;color:var(--muted);margin-bottom:6px}
.auth-box{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(18,35,63,.72)}
.auth-row{display:flex;gap:8px;align-items:center}
.auth-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);padding:10px}
.auth-status{font-size:12px;color:var(--muted);margin-bottom:8px}
.sync-note{font-size:11px;color:var(--muted);margin-top:8px}
.personnel-drawer{position:absolute;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:40;background:rgba(7,17,31,.98);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none}
.personnel-drawer.open{display:block}
.personnel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.personnel-head strong{font-size:13px}
.personnel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pos-slot{min-height:58px;border:1px dashed var(--line);border-radius:12px;padding:6px;text-align:center;background:rgba(18,35,63,.7)}
.pos-slot .pos{font-size:10px;color:var(--muted);font-weight:900}
.pos-slot .kid{font-size:12px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster-tray{display:flex;flex-wrap:wrap;gap:6px}
.kid-chip{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);padding:7px 10px;font-size:11px;font-weight:800;touch-action:none}
.kid-chip.selected-kid{outline:2px solid var(--accent)}
.personnel-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.player-name-svg{fill:#f6f8fb;font-size:9px;font-weight:800;paint-order:stroke;stroke:#0b1b33;stroke-width:2px;stroke-linejoin:round}
@media (min-width:700px){.field-wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="field-wrap">
    <div class="top-left-stack">
      <button id="playsBtn" class="pill top-left">☰ Plays</button>
      <button id="personnelBtn" class="pill">👥 Personnel</button>
    </div>
    <div class="top-right-stack">
      <button id="diagramSaveBtn" class="pill save-icon" aria-label="Save play" title="Save play"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false"><path fill="currentColor" d="M5 3h12.6L21 6.4V21H3V3h2Zm1 2v5h10V5H6Zm-1 8v6h14V8.1L16.9 5H18v8H5Zm3 2h8v4H8v-4Z"/></svg></button>
      <button id="playBtn" class="pill">▶ Play</button>
    </div>

    <div class="heading">
      <div class="name-row">
        <button id="playName" class="play-name">REBEL JET</button>
        <button id="editName" class="edit" aria-label="Edit play name">✎</button>
      </div>
      <div class="ball-row">
        <label class="ball-control">ACTION <select id="actionType"><option>HANDOFF</option><option>PASS</option></select></label>
        <label class="ball-control">TO <select id="ballTarget"><option>H</option><option>Y</option><option>X</option><option>Z</option><option>C</option></select></label>
      </div>
    </div>

    <div id="nameEditor" class="name-editor">
      <div class="small">Play name</div>
      <div class="row"><input id="nameInput" value="REBEL JET"><button id="nameDone" class="pill">Done</button></div>
    </div>

    <svg id="field" viewBox="0 0 420 760" aria-label="Ole Miss Rebels play designer">
      <rect width="420" height="760" fill="transparent"/>
      <g stroke="rgba(159,177,199,.24)" stroke-width="1">
        <line x1="0" y1="95" x2="420" y2="95"/><line x1="0" y1="190" x2="420" y2="190"/>
        <line x1="0" y1="285" x2="420" y2="285"/><line x1="0" y1="475" x2="420" y2="475"/>
        <line x1="0" y1="570" x2="420" y2="570"/><line x1="0" y1="665" x2="420" y2="665"/>
      </g>
      <line x1="0" y1="380" x2="420" y2="380" stroke="#ffca28" stroke-width="4"/>
      <text x="14" y="366" fill="#9fb1c7" font-size="12" font-weight="800">LINE OF SCRIMMAGE</text>
      <text x="210" y="130" text-anchor="middle" fill="#9fb1c7" font-size="12" font-weight="800">DEFENSE</text>
      <text x="210" y="675" text-anchor="middle" fill="#9fb1c7" font-size="12" font-weight="800">OFFENSE</text>
      <g id="routes"></g><g id="passLayer"></g><g id="players"></g>
      <g id="football"><ellipse cx="210" cy="396" rx="12" ry="7" fill="#8d5524" transform="rotate(-20 210 396)"/>
        <path d="M205 393 L215 399 M208 392 L210 398 M211 393 L213 399" stroke="#fff" stroke-width="1.5"/></g>
    </svg>

    <div class="route-wrap">
      <button id="routeToggle" class="route-toggle">Routes ▾</button>
      <div id="routeRail" class="route-rail hidden">
        <button class="route-pill" data-route="jet">JET</button>
        <button class="route-pill" data-route="fakejet">FAKE JET</button>
        <button class="route-pill" data-route="counter">COUNTER</button>
        <button class="route-pill" data-route="go">GO</button>
        <button class="route-pill" data-route="slant">SLANT</button>
        <button class="route-pill" data-route="out">OUT</button>
        <button class="route-pill" data-route="drag">DRAG</button>
        <button class="route-pill" data-route="flat">FLAT</button>
        <button class="route-pill" data-route="fake">MARK FAKE</button>
        <button class="route-pill" data-route="clear">CLEAR</button>
      </div>
    </div>

    <div id="personnelDrawer" class="personnel-drawer">
      <div class="personnel-head"><strong>Personnel</strong><button id="personnelDone" class="pill">Done</button></div>
      <div id="personnelGrid" class="personnel-grid"></div>
      <div class="small">Sideline / roster — drag or tap a player, then tap a position.</div>
      <div id="rosterTray" class="roster-tray"></div>
      <div class="personnel-actions"><button id="clearPersonnel" class="pill">Clear</button><button id="resetPersonnel" class="pill">Reset Lineup</button></div>
    </div>
    <div class="bottom-keys"><div class="key pass">▲ ▲ ▲ = pass</div><div class="key">Solid = route • Dashed = fake</div></div>
    <div class="bottom-center"><button id="selected" class="selected">H selected</button></div>
    <div class="bottom-controls"><button id="drawBtn" class="pill">✏ Draw</button><button id="resetBtn" class="pill">↺ Reset</button></div>
  </div>
</div>

<dialog id="playsDialog"><div class="sheet">
  <h3>Playbook</h3><p>Every new play starts in REBEL.</p>
  <div id="authBox" class="auth-box">
    <div id="authSignedOut">
      <div class="auth-status">Sign in to share plays with your coaching staff.</div>
      <div class="auth-row"><input id="coachEmail" type="email" inputmode="email" autocomplete="email" placeholder="Coach email"><button id="magicLinkBtn" class="pill">Send Link</button></div>
      <div id="authMessage" class="sync-note"></div>
    </div>
    <div id="authSignedIn" hidden>
      <div id="signedInAs" class="auth-status"></div>
      <div class="auth-row"><button id="refreshCloudBtn" class="pill">↻ Sync Plays</button><button id="signOutBtn" class="pill">Sign Out</button></div>
      <div id="syncStatus" class="sync-note">Shared cloud playbook connected.</div>
    </div>
  </div>
  <button id="newBtn" class="pill wide">New REBEL Play</button>
  <div id="savedList" class="list"></div>
  <button id="closeDialog" class="pill wide" style="margin-top:14px">Close</button>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s), ns="http://www.w3.org/2000/svg";
const SUPABASE_URL="https://wyktmcyvduinskonsdwr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_yPM8lMOgGX9gqo7_Nuubxg_OckQb8Ch";
const cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let sessionUser=null,currentCloudId=null,cloudSyncTimer=null,lastLocalSaveAt=0;
const BASE={X:{x:55,y:380},C:{x:210,y:380},Z:{x:345,y:380},QB:{x:210,y:452},Y:{x:166,y:520},H:{x:254,y:520}};
const ORDER=["X","C","Z","QB","Y","H"];
const ROSTER=["Landon","Jack S","Jack D","Hudson","Grayson","Ethan","Trent","Renee"];
const DEFAULT_PERSONNEL={QB:"Renee",C:"Trent",H:"Ethan",Y:"Landon",X:"Jack S",Z:"Hudson"};
let personnel=clone(DEFAULT_PERSONNEL),selectedKid=null;
let players=clone(BASE),routes=emptyRoutes(),fakes=emptyFakes(),selected="H",drawing=false,raf=null;
let saved=loadSaved();
function clone(v){return JSON.parse(JSON.stringify(v))}
function emptyRoutes(){return {X:[],C:[],Z:[],QB:[],Y:[],H:[]}}
function emptyFakes(){return {X:false,C:false,Z:false,QB:false,Y:false,H:false}}
function cleanPlayers(p){const q=clone(p||BASE);delete q.__personnel;return q}
function extractPersonnel(p){return clone((p&&p.__personnel)||{})}
function playersForSave(){const q=clone(players);q.__personnel=clone(personnel);return q}
function E(t,a={}){const e=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}
function endpoint(n){const a=routes[n];return a&&a.length?a[a.length-1]:players[n]}
function triangle(cx,cy,angle,size=7){const pts=[[size,0],[-size*.65,size*.65],[-size*.65,-size*.65]].map(([x,y])=>{const c=Math.cos(angle),sn=Math.sin(angle);return `${cx+x*c-y*sn},${cy+x*sn+y*c}`}).join(" ");return E("polygon",{points:pts,fill:"#ff5252"})}
function drawPass(){const layer=$("#passLayer");layer.innerHTML="";if($("#actionType").value!=="PASS")return;const from=endpoint("QB"),to=endpoint($("#ballTarget").value),dx=to.x-from.x,dy=to.y-from.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),count=Math.max(4,Math.floor(dist/35));for(let i=1;i<=count;i++){const f=i/(count+1);layer.append(triangle(from.x+dx*f,from.y+dy*f,ang,i===count?8:6))}}
function setName(v){const n=(v||"").trim()||"Untitled REBEL Play";$("#playName").textContent=n;$("#nameInput").value=n}
function choose(n,openMenu=true){selected=n;$("#selected").textContent=n+(fakes[n]?" FAKE":" selected");if(openMenu){$("#routeRail").classList.remove("hidden");$("#routeToggle").textContent="Routes ▴"}draw()}
function draw(){
  $("#players").innerHTML="";$("#routes").innerHTML="";
  ORDER.forEach(n=>{
    const pts=[players[n],...routes[n]];
    if(pts.length>1){
      const dash=fakes[n]?"10 8":"";
      $("#routes").append(E("polyline",{points:pts.map(p=>p.x+","+p.y).join(" "),fill:"none",stroke:n===selected?"#ef5350":"#f6f8fb","stroke-width":n===selected?5:3.5,"stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":dash}));
      const a=pts[pts.length-2],b=pts[pts.length-1],ang=Math.atan2(b.y-a.y,b.x-a.x),len=12;
      $("#routes").append(E("polyline",{points:`${b.x-len*Math.cos(ang-.55)},${b.y-len*Math.sin(ang-.55)} ${b.x},${b.y} ${b.x-len*Math.cos(ang+.55)},${b.y-len*Math.sin(ang+.55)}`,fill:"none",stroke:n===selected?"#ef5350":"#f6f8fb","stroke-width":4,"stroke-linecap":"round","stroke-dasharray":dash}));
      if(fakes[n]){const lab=E("text",{x:b.x,y:b.y-10,"text-anchor":"middle",fill:"#9fb1c7","font-size":10,"font-weight":900});lab.textContent="FAKE";$("#routes").append(lab)}
    }
    const g=E("g",{"data-player":n,role:"button"}),c=E("circle",{cx:players[n].x,cy:players[n].y,r:n===selected?25:22,fill:n===selected?"#52252d":"#12233f",stroke:n===selected?"#ef5350":"#f6f8fb","stroke-width":n===selected?4:2.5});
    const t=E("text",{x:players[n].x,y:players[n].y+5,"text-anchor":"middle",fill:"#f6f8fb","font-size":15,"font-weight":900});t.textContent=n;g.append(c,t);
    if(personnel[n]){const name=E("text",{x:players[n].x,y:players[n].y+37,"text-anchor":"middle",class:"player-name-svg"});name.textContent=personnel[n];g.append(name)}
    g.addEventListener("click",e=>{e.stopPropagation();choose(n)});$("#players").append(g)
  });
  drawPass();
}
function preset(k,reverse=false){
  const s=players[selected],side=s.x<210?-1:1,dir=reverse?-side:side;let r=[];
  if(k==="jet")r=reverse?[{x:210,y:s.y},{x:300,y:s.y},{x:375,y:s.y-42}]:[{x:210,y:s.y},{x:120,y:s.y},{x:45,y:s.y-42}];
  if(k==="fakejet"){r=reverse?[{x:210,y:s.y},{x:310,y:s.y},{x:378,y:s.y-32}]:[{x:210,y:s.y},{x:110,y:s.y},{x:42,y:s.y-32}];fakes[selected]=true}
  if(k==="counter")r=[{x:s.x-dir*25,y:s.y-20},{x:s.x-dir*90,y:s.y-75},{x:s.x-dir*145,y:s.y-130}];
  if(k==="go")r=[{x:s.x,y:s.y-145},{x:s.x,y:140}];
  if(k==="slant")r=[{x:s.x-dir*65,y:s.y-105},{x:reverse?(s.x-dir*130):210,y:210}];
  if(k==="out")r=[{x:s.x,y:s.y-90},{x:s.x+dir*85,y:s.y-90}];
  if(k==="drag")r=[{x:s.x,y:s.y-50},{x:s.x-dir*155,y:s.y-50}];
  if(k==="flat")r=[{x:s.x+dir*65,y:s.y-15},{x:s.x+dir*110,y:s.y-35}];
  if(k==="fake"){fakes[selected]=!fakes[selected];choose(selected);return}
  if(k==="clear"){r=[];fakes[selected]=false}
  if(!["fakejet","fake","clear"].includes(k))fakes[selected]=false;
  routes[selected]=r.map(p=>({x:Math.max(20,Math.min(400,p.x)),y:p.y}));
  choose(selected)
}
document.querySelectorAll("[data-route]").forEach(b=>{
  let tapTimer=null;
  b.addEventListener("click",e=>{
    e.preventDefault();
    const k=b.dataset.route;
    if(["fake","clear"].includes(k)){preset(k);return}
    if(tapTimer){
      clearTimeout(tapTimer);tapTimer=null;
      preset(k,true);
      const old=b.textContent;b.textContent=old+" ↔";setTimeout(()=>b.textContent=old,450);
    }else{
      tapTimer=setTimeout(()=>{preset(k,false);tapTimer=null},230);
    }
  });
});
$("#routeToggle").onclick=()=>{const r=$("#routeRail"),hide=!r.classList.contains("hidden");r.classList.toggle("hidden",hide);$("#routeToggle").textContent=hide?"Routes ▾":"Routes ▴"};
$("#actionType").onchange=draw;$("#ballTarget").onchange=draw;
$("#drawBtn").onclick=()=>{drawing=!drawing;$("#drawBtn").textContent=drawing?"✓ Finish":"✏ Draw";$("#selected").textContent=drawing?"Drawing "+selected:selected+(fakes[selected]?" FAKE":" selected")};
$("#field").addEventListener("click",e=>{if(!drawing)return;const p=$("#field").createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform($("#field").getScreenCTM().inverse());routes[selected].push({x:Math.max(20,Math.min(400,q.x)),y:Math.max(90,Math.min(680,q.y))});draw()});
function openName(){ $("#nameEditor").classList.add("open");$("#nameInput").focus();$("#nameInput").select()}
$("#playName").onclick=openName;$("#editName").onclick=openName;$("#nameDone").onclick=()=>{setName($("#nameInput").value);$("#nameEditor").classList.remove("open")};
$("#nameInput").addEventListener("keydown",e=>{if(e.key==="Enter"){setName(e.currentTarget.value);$("#nameEditor").classList.remove("open")}});
function renderPersonnel(){
  const grid=$("#personnelGrid"),tray=$("#rosterTray");grid.innerHTML="";tray.innerHTML="";
  ORDER.forEach(pos=>{
    const slot=document.createElement("button");slot.className="pos-slot";slot.dataset.pos=pos;
    slot.innerHTML='<div class="pos">'+pos+'</div><div class="kid">'+(personnel[pos]||"—")+'</div>';
    slot.onclick=()=>{if(selectedKid){assignKid(selectedKid,pos);selectedKid=null;renderPersonnel()}};
    slot.ondragover=e=>e.preventDefault();
    slot.ondrop=e=>{e.preventDefault();const kid=e.dataTransfer.getData("text/plain");if(kid)assignKid(kid,pos)};
    grid.append(slot);
  });
  ROSTER.forEach(kid=>{
    const chip=document.createElement("button");chip.className="kid-chip"+(selectedKid===kid?" selected-kid":"");chip.textContent=kid;chip.draggable=true;
    chip.onclick=()=>{selectedKid=selectedKid===kid?null:kid;renderPersonnel()};
    chip.ondragstart=e=>e.dataTransfer.setData("text/plain",kid);
    tray.append(chip);
  });
}
function assignKid(kid,pos){
  Object.keys(personnel).forEach(p=>{if(personnel[p]===kid)delete personnel[p]});
  if(personnel[pos]){
    const displaced=personnel[pos];
    Object.keys(personnel).forEach(p=>{if(personnel[p]===displaced)delete personnel[p]});
  }
  personnel[pos]=kid;draw();renderPersonnel();
}
$("#personnelBtn").onclick=()=>{$("#personnelDrawer").classList.toggle("open");renderPersonnel()};
$("#personnelDone").onclick=()=>$("#personnelDrawer").classList.remove("open");
$("#clearPersonnel").onclick=()=>{personnel={};selectedKid=null;draw();renderPersonnel()};
$("#resetPersonnel").onclick=()=>{personnel=clone(DEFAULT_PERSONNEL);selectedKid=null;draw();renderPersonnel()};
function routeAt(n,t){const a=[players[n],...routes[n]];if(a.length<2)return players[n];let ls=[],tot=0;for(let i=1;i<a.length;i++){const l=Math.hypot(a[i].x-a[i-1].x,a[i].y-a[i-1].y);ls.push(l);tot+=l}let d=t*tot;for(let i=0;i<ls.length;i++){if(d<=ls[i]){const f=ls[i]?d/ls[i]:0;return{x:a[i].x+(a[i+1].x-a[i].x)*f,y:a[i].y+(a[i+1].y-a[i].y)*f}}d-=ls[i]}return a[a.length-1]}
$("#playBtn").onclick=()=>{
  if(raf)cancelAnimationFrame(raf);draw();const gs={};document.querySelectorAll("#players g").forEach(g=>gs[g.dataset.player]=g);
  const action=$("#actionType").value,target=$("#ballTarget").value,throwStart=.58,throwEnd=.76;let start=null;
  function tick(ts){
    if(!start)start=ts;const t=Math.min(1,(ts-start)/4000);
    const moveT=action==="PASS"?Math.min(1,t/throwStart):t;
    ORDER.forEach(n=>{const q=routeAt(n,moveT),st=players[n];gs[n].setAttribute("transform",`translate(${q.x-st.x} ${q.y-st.y})`)});
    let bp;
    if(t<.12){
      const a=players.C,b=players.QB,f=t/.12;bp={x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};
    }else if(action==="PASS"){
      const qbEnd=endpoint("QB"),targetEnd=endpoint(target);
      if(t<throwStart){
        const qbT=Math.min(1,t/throwStart);bp=routeAt("QB",qbT);
      }else if(t<throwEnd){
        const f=(t-throwStart)/(throwEnd-throwStart);bp={x:qbEnd.x+(targetEnd.x-qbEnd.x)*f,y:qbEnd.y+(targetEnd.y-qbEnd.y)*f};
      }else bp=targetEnd;
    }else{
      bp=routeAt(target,Math.min(1,(t-.12)/.88));
    }
    $("#football").setAttribute("transform",`translate(${bp.x-210} ${bp.y-396})`);
    if(t<1)raf=requestAnimationFrame(tick);else raf=null;
  }
  raf=requestAnimationFrame(tick);
};
$("#resetBtn").onclick=()=>{if(raf)cancelAnimationFrame(raf);raf=null;draw();$("#football").setAttribute("transform","translate(0 0)")};
$("#playsBtn").onclick=()=>{$("#playsDialog").showModal();renderSaved();if(sessionUser)setTimeout(()=>loadCloudPlays(false),250)};$("#closeDialog").onclick=()=>$("#playsDialog").close();
function snap(){return{id:currentCloudId||undefined,name:$("#playName").textContent,action:$("#actionType").value,target:$("#ballTarget").value,players:playersForSave(),routes:clone(routes),fakes:clone(fakes)}}
function normalizePlay(p){if(p.action&&p.target)return p;const isPass=(p.name||"").toUpperCase().includes("PASS")||p.ball==="QB";return {...p,action:isPass?"PASS":"HANDOFF",target:isPass?"X":(p.ball||"H")}}
function loadSaved(){try{const v=JSON.parse(localStorage.getItem("fnlRebelsPlays")||"null");if(Array.isArray(v)&&v.length)return v.map(normalizePlay)}catch{}return defaults()}
function persist(){localStorage.setItem("fnlRebelsPlays",JSON.stringify(saved))}
function defaults(){return[

{name:"REBEL COUNTER",action:"HANDOFF",target:"Y",players:clone(BASE),routes:{X:[{x:55,y:250}],C:[{x:210,y:292}],Z:[{x:345,y:250}],QB:[],Y:[{x:195,y:478},{x:285,y:428},{x:350,y:368}],H:[{x:210,y:508},{x:110,y:508},{x:40,y:473}]},fakes:{...emptyFakes(),H:true}},
{name:"REBEL JET PASS",action:"PASS",target:"X",players:clone(BASE),routes:{X:[{x:55,y:350},{x:120,y:280}],C:[{x:210,y:292}],Z:[{x:345,y:350},{x:300,y:280}],QB:[],Y:[{x:166,y:432},{x:220,y:380}],H:[{x:210,y:508},{x:110,y:508},{x:40,y:473}]},fakes:{...emptyFakes(),H:true}}
]}
function encodeSharePlay(p){
  const json=JSON.stringify(normalizePlay(p));
  const bytes=new TextEncoder().encode(json);
  let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replaceAll("+","-").replaceAll("/","_").replaceAll("=","");
}
function decodeSharePlay(v){
  try{
    let b64=v.replaceAll("-","+").replaceAll("_","/");
    while(b64.length%4)b64+="=";
    const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return normalizePlay(JSON.parse(new TextDecoder().decode(bytes)));
  }catch{return null}
}
async function sharePlay(p){
  const url=location.origin+location.pathname+"#share="+encodeSharePlay(p);
  const data={title:p.name,text:"Watch "+p.name,url};
  try{
    if(navigator.share){await navigator.share(data)}
    else{
      await navigator.clipboard.writeText(url);
      $("#syncStatus").textContent="Share link copied.";
    }
  }catch(err){
    if(err?.name!=="AbortError"){
      try{await navigator.clipboard.writeText(url);$("#syncStatus").textContent="Share link copied."}catch{}
    }
  }
}
function renderSaved(){
  const box=$("#savedList");box.innerHTML="";
  saved.forEach((p,i)=>{
    const row=document.createElement("div");row.className="saved";
    const load=document.createElement("button");load.className="pill";load.textContent=p.name;
    load.onclick=()=>{p=normalizePlay(p);currentCloudId=p.id||null;personnel=extractPersonnel(p.players);players=cleanPlayers(p.players);routes=clone(p.routes);fakes=clone(p.fakes||emptyFakes());$("#actionType").value=p.action;$("#ballTarget").value=p.target;setName(p.name);$("#playsDialog").close();$("#routeRail").classList.add("hidden");$("#routeToggle").textContent="Routes ▾";choose("H",false)};
    const share=document.createElement("button");share.className="pill share-btn";share.textContent="Share";share.onclick=()=>sharePlay(p);
    const del=document.createElement("button");del.className="pill delete-btn";del.textContent="Delete";
    del.onclick=async()=>{
      if(del.classList.contains("busy"))return;
      del.textContent="Deleting…";del.classList.add("busy");
      const previous=[...saved];
      saved=saved.filter(x=>x.id!==p.id && x.name!==p.name);persist();renderSaved();
      try{
        const {data:{session}}=await cloud.auth.getSession();
        sessionUser=session?.user||null;
        if(p.id&&sessionUser){
          const {error}=await cloud.from("plays").delete().eq("id",p.id);
          if(error)throw error;
          $("#syncStatus").textContent="Play deleted.";
          await loadCloudPlays(false);
        }else{$("#authMessage").textContent="Play deleted from this phone."}
      }catch(err){
        saved=previous;persist();renderSaved();
        const msg=err?.message||String(err);
        if(sessionUser)$("#syncStatus").textContent="Delete failed: "+msg; else $("#authMessage").textContent="Delete failed: "+msg;
        console.error("deletePlay",err);
      }
    };
    row.append(load,share,del);box.append(row)
  })
}
async function saveCurrentPlay(){
  const buttons=[$("#saveBtn"),$("#diagramSaveBtn")].filter(Boolean);
  if(buttons.some(b=>b.classList.contains("busy")))return;
  buttons.forEach(b=>b.classList.add("busy"));
  const diagram=$("#diagramSaveBtn"),oldIcon=diagram?diagram.innerHTML:"";
  if(diagram)diagram.innerHTML='<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.34 2.34A7.96 7.96 0 0 0 12 4Z"/></svg>';
  if($("#saveBtn"))$("#saveBtn").textContent="Saving…";
  const p=snap();
  lastLocalSaveAt=Date.now();
  const localCopy={...p,id:currentCloudId||p.id};
  const localIndex=saved.findIndex(x=>(localCopy.id&&x.id===localCopy.id)||x.name===localCopy.name);
  if(localIndex>=0)saved[localIndex]=localCopy;else saved.push(localCopy);
  persist();renderSaved();
  try{
    const {data:{session}}=await cloud.auth.getSession();
    sessionUser=session?.user||null;
    if(!sessionUser){
      $("#authMessage").textContent="Saved on this phone. Sign in to sync with your assistant coach.";
      return;
    }
    const payload={name:p.name,action:p.action,target:p.target,players:p.players,routes:p.routes,fakes:p.fakes};
    let result=null;
    if(currentCloudId){
      result=await cloud.from("plays").update(payload).eq("id",currentCloudId).select("*").maybeSingle();
      if(result.error)throw result.error;
      if(!result.data)currentCloudId=null;
    }
    if(!currentCloudId){
      const existing=await cloud.from("plays").select("id").eq("name",p.name).order("updated_at",{ascending:false}).limit(1);
      if(existing.error)throw existing.error;
      if(existing.data&&existing.data.length){
        currentCloudId=existing.data[0].id;
        result=await cloud.from("plays").update(payload).eq("id",currentCloudId).select("*").single();
      }else{
        result=await cloud.from("plays").insert(payload).select("*").single();
      }
      if(result.error)throw result.error;
    }
    if(result&&result.data&&result.data.id){
      currentCloudId=result.data.id;
      const cloudCopy={id:result.data.id,name:result.data.name,action:result.data.action,target:result.data.target,players:result.data.players,routes:result.data.routes,fakes:result.data.fakes,updated_at:result.data.updated_at};
      const idx=saved.findIndex(x=>x.id===currentCloudId||x.name===p.name);
      if(idx>=0)saved[idx]=cloudCopy;else saved.push(cloudCopy);
      persist();renderSaved();
    }
    $("#syncStatus").textContent="Saved to shared playbook.";
    if(diagram)diagram.innerHTML='<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="m9.2 16.6-4.4-4.4 1.4-1.4 3 3 8.6-8.6 1.4 1.4-10 10Z"/></svg>';
    buttons.forEach(b=>b.classList.add("success"));
    setTimeout(()=>buttons.forEach(b=>b.classList.remove("success")),700);
  }catch(err){
    const msg=err?.message||String(err);
    if(sessionUser)$("#syncStatus").textContent="Saved on this phone, but cloud sync failed: "+msg;
    else $("#authMessage").textContent="Saved on this phone. Cloud sync failed: "+msg;
    console.error("saveCurrentPlay",err);
  }finally{
    if($("#saveBtn"))$("#saveBtn").textContent="Save Play";
    if(diagram)setTimeout(()=>diagram.innerHTML=oldIcon,700);
    buttons.forEach(b=>b.classList.remove("busy"));
  }
}
if($("#saveBtn"))$("#saveBtn").onclick=saveCurrentPlay;
$("#diagramSaveBtn").onclick=saveCurrentPlay;
$("#newBtn").onclick=()=>{currentCloudId=null;personnel=clone(DEFAULT_PERSONNEL);players=clone(BASE);routes=emptyRoutes();fakes=emptyFakes();selected="H";$("#actionType").value="HANDOFF";$("#ballTarget").value="H";setName("New REBEL Play");$("#playsDialog").close();$("#routeRail").classList.add("hidden");$("#routeToggle").textContent="Routes ▾";choose("H",false)};
async function loadCloudPlays(showStatus=true){
  if(!sessionUser)return;
  if(showStatus)$("#syncStatus").textContent="Syncing shared playbook…";
  const {data,error}=await cloud.from("plays").select("*").order("updated_at",{ascending:false});
  if(error){$("#syncStatus").textContent="Sync failed. Showing saved phone copy.";return}
  const rows=data||[],seen=new Map(),duplicateIds=[];
  for(const r of rows){
    const key=(r.name||"").trim().toLowerCase();
    if(!seen.has(key))seen.set(key,r); else duplicateIds.push(r.id);
  }
  const cloudRows=[...seen.values()].map(r=>({id:r.id,name:r.name,action:r.action,target:r.target,players:r.players,routes:r.routes,fakes:r.fakes,updated_at:r.updated_at}));
  if(Date.now()-lastLocalSaveAt<2500){
    const byId=new Map(cloudRows.map(r=>[r.id,r]));
    saved=saved.map(local=>local.id&&byId.has(local.id)?local:local);
    const existingIds=new Set(saved.map(x=>x.id).filter(Boolean));
    for(const row of cloudRows)if(!existingIds.has(row.id))saved.push(row);
  }else{
    saved=cloudRows;
  }
  persist();renderSaved();
  if(duplicateIds.length){
    const {error:dedupeError}=await cloud.from("plays").delete().in("id",duplicateIds);
    if(dedupeError){$("#syncStatus").textContent="Synced. Duplicate cleanup failed.";return}
  }
  $("#syncStatus").textContent=duplicateIds.length?("Synced and removed "+duplicateIds.length+" duplicate"+(duplicateIds.length===1?"":"s")+"." ):"Shared playbook synced.";
}
let migrationRunning=false;
async function migrateLocalPlays(){
  if(!sessionUser||migrationRunning||localStorage.getItem("fnlRebelsCloudMigratedV1")==="yes")return;
  migrationRunning=true;
  try{
    const locals=loadSaved().filter(p=>!p.id);
    const unique=[...new Map(locals.map(p=>[(p.name||"").trim().toLowerCase(),normalizePlay(p)])).values()];
    for(const p of unique){
      const {data:match,error}=await cloud.from("plays").select("id").eq("name",p.name).limit(1);
      if(error)continue;
      if(!match||!match.length)await cloud.from("plays").insert({name:p.name,action:p.action,target:p.target,players:p.players,routes:p.routes,fakes:p.fakes});
    }
    localStorage.setItem("fnlRebelsCloudMigratedV1","yes");
  }finally{migrationRunning=false}
}
let authRefreshRunning=false;
async function refreshAuthUI(){
  if(authRefreshRunning)return;
  authRefreshRunning=true;
  try{
  const {data:{session}}=await cloud.auth.getSession();
  sessionUser=session?.user||null;
  $("#authSignedOut").hidden=!!sessionUser;
  $("#authSignedIn").hidden=!sessionUser;
  if(sessionUser){
    $("#signedInAs").textContent="Signed in as "+(sessionUser.email||"coach");
    await migrateLocalPlays();
    await loadCloudPlays(false);
    if(cloudSyncTimer)clearInterval(cloudSyncTimer);
    cloudSyncTimer=setInterval(()=>{if(document.visibilityState==="visible")loadCloudPlays(false)},30000);
  }else{
    if(cloudSyncTimer){clearInterval(cloudSyncTimer);cloudSyncTimer=null}
  }
  }finally{authRefreshRunning=false}
}

cloud.auth.onAuthStateChange(()=>setTimeout(refreshAuthUI,0));

function loadSharedView(){
  if(!location.hash.startsWith("#share="))return false;
  const p=decodeSharePlay(location.hash.slice(7));
  if(!p)return false;
  document.body.classList.add("shared-view");
  currentCloudId=null;
  personnel=extractPersonnel(p.players);
  players=cleanPlayers(p.players);
  routes=clone(p.routes||emptyRoutes());
  fakes=clone(p.fakes||emptyFakes());
  $("#actionType").value=p.action||"HANDOFF";
  $("#ballTarget").value=p.target||"H";
  setName(p.name||"REBEL PLAY");
  selected="H";
  draw();
  return true;
}
const isSharedView=loadSharedView();
if(!isSharedView){
  renderSaved();$("#actionType").value="HANDOFF";$("#ballTarget").value="H";$("#routeRail").classList.add("hidden");$("#routeToggle").textContent="Routes ▾";renderPersonnel();draw();refreshAuthUI();
}
